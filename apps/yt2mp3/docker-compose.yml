services:
  yt2mp3:
    build: .
    container_name: yt2mp3
    ports:
      - "8080:8080"
    environment:
      - DEFAULT_BITRATE=192          # 128 | 192 | 256 | 320
      - MAX_DURATION_SECONDS=10800   # reject videos longer than 3h
      - FILE_TTL_SECONDS=3600        # temp files (not library songs) are deleted after 1h
      - AUTO_ADD_TO_LIBRARY=false    # true = skip the button and add every song to the library
      - LIBRARY_SUBDIR=You Link      # folder inside the music library for converted songs
      - MAX_PLAYLIST_ITEMS=100       # most songs taken from one playlist
      - PUID=${PUID:-1000}           # your user id on the server (run: id -u)
      - PGID=${PGID:-1000}           # your group id on the server (run: id -g)
    volumes:
      - yt2mp3-data:/data
      - ${MUSIC_DIR:-./music}:/music
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=@every 1m    # pick up new songs within about a minute
      - ND_LOGLEVEL=info
    volumes:
      - ./navidrome-data:/data
      - ${MUSIC_DIR:-./music}:/music:ro
    restart: unless-stopped

volumes:
  yt2mp3-data:
